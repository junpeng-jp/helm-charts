global:
  # Pin the image tag to prevent redeployments from accidentally changing the Home Assistant version.
  # To pull from a private registry, create an image pull secret:
  #   kubectl create secret docker-registry <name> \
  #     --docker-server=<registry> --docker-username=<user> --docker-password=<token>
  image:
    registry: ghcr.io
    repository: home-assistant/home-assistant
    tag: "2026.5"
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  testImage:
    registry: docker.io
    repository: busybox
    tag: "1.37"
    digest: ""
    pullPolicy: IfNotPresent

# nameOverride: home-assistant
# fullnameOverride: home-assistant
# Keep at 1 when using ReadWriteOnce storage. Multiple replicas require ReadWriteMany.
replicaCount: 1
podManagementPolicy: OrderedReady
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

serviceAccount:
  create: false
  name: ""
  annotations: {}

# Extra init containers injected after the chart-managed init containers (gitops-setup, bootstrap)
# and before Home Assistant starts. Use this for tasks that depend on bootstrap having already run
# (e.g. secrets.yaml written, HACS installed, configuration.yaml in place).
# Names "gitops-setup", "bootstrap", and "check-config" are reserved by the chart.
initContainers: []

env:
  - name: TZ
    value: UTC

# secretVolumeMounts mounts Kubernetes Secrets into the main container under /run/secrets/.
# For Home Assistant's secrets.yaml, see homeAssistant.initContainer.tasks.setupSecretsYaml below.
#
# Fields:
#   secretName: (required) name of the Kubernetes Secret to mount.
#   mountPath:  subdirectory under /run/secrets/ where the secret is mounted.
#               Defaults to secretName.
#   name:       K8s volume name (must be unique across all entries).
#               Required when the same secretName appears more than once — use it to
#               disambiguate the volume while mountPath controls where each copy lands.
#               Defaults to secretName.
#
# Example:
#   secretVolumeMounts:
#     - secretName: my-secret                  # → /run/secrets/my-secret
#     - secretName: my-secret
#       mountPath: my-secret-alt               # → /run/secrets/my-secret-alt
#       name: my-secret-alt                    # required: unique volume name for the second entry
secretVolumeMounts: []
extraVolumes: []
extraVolumeMounts: []

startupProbe:
  enabled: false
  # Enable for instances with many integrations or slow hardware - prevents liveness
  # probe restart loops during long cold starts. Allows up to 3 min: 18 × 10s.
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  failureThreshold: 18
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 5
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10  # HA is slow to report ready. 10 × 10s = 100s total grace period

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    # cpu limit intentionally omitted - Home Assistant automations can cause brief CPU spikes

# podSecurityContext and containerSecurityContext are intentionally omitted.
# home-assistant uses s6-overlay as its init system, which must start as root and write to /run.
# Setting runAsNonRoot or readOnlyRootFilesystem on the main container causes an immediate crash.

pod:
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  hostNetwork: false    # Enable only if you want to have auto-discovery of wifi devices via mDNS

# Add services and ports here. Ingress and monitor.metric.port reference ports by their key name.
networking:
  headlessService:
    publishNotReadyAddresses: true  # include not-yet-ready pods in headless DNS, required for StatefulSet rolling restarts
  service:
    app:
      enabled: true
      type: ClusterIP
      ports:
        http:
          enabled: true
          port: 8123
          protocol: TCP

# Enable gateway (Gateway API) or traefik (Traefik IngressRoute), but not both.
ingress:
  gateway:
    enabled: false
    parentRefs:
      - name: my-gateway
        namespace: default
    hostnames:
      - ha.example.com

  traefik:
    enabled: false
    entryPoints:
      - websecure
    hostnames:
      - ha.example.com
    middlewares: []
    tls:
      enabled: false
      secretName: ""
      certResolver: ""

persistence:
  enabled: true
  storageClass: ""  # uses the cluster default
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations: {}
  labels: {}
  existingClaim: ""   # use an existing PVC directly (skips volumeClaimTemplate)
  existingVolume: ""  # bind the volumeClaimTemplate to a specific PV by name, mutually exclusive with existingClaim

# Creates a PodMonitor for the Prometheus Operator. Requires the CRD to be installed in your cluster.
monitor:
  metric:
    enabled: false
    path: /api/prometheus
    port: http
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

homeAssistant:
  # Override image to change it for all utility init containers at once.
  initContainer:
    image:
      registry: docker.io
      repository: alpine
      tag: "3.21"
      digest: ""          # takes precedence over tag when set (e.g. sha256:abc123)
      pullPolicy: IfNotPresent

    resources:
      requests:
        memory: 64Mi
        cpu: 50m

    tasks:
      # Installs HACS (Home Assistant Community Store) into /config/custom_components/hacs.
      # Requires persistence.enabled.
      setupHACS:
        enabled: false
        version: "2.0.5"   # required when enabled
        sha256: ""          # optional. if set, verifies the downloaded zip before installing

      # Generates /config/secrets.yaml from a Kubernetes Secret before Home Assistant starts.
      # Overwrites /config/secrets.yaml on every pod restart — don't edit it via Studio Code
      # Server, SSH, or Samba. Those changes are lost on restart.
      setupSecretsYaml:
        enabled: false
        secretName: ""  # required when enabled is true

      # Sets up an SSH identity and bare git mirrors for gitops-managed configuration.
      # Requires persistence.enabled.
      #
      # The gitops CLI (clone|stage|deploy|get) is bundled in the ConfigMap. The init
      # container installs it to /config/.gitops/run/bin/gitops on the PVC so it is
      # available at runtime from shell commands and HA automations.
      #
      # Volatile setup files (binary, SSH config, allowedSigners) are written to
      # /config/.gitops/run/ and replaced on every pod start. State files written by
      # the CLI are kept under /config/.gitops/state/ and survive pod restarts.
      #
      # Workflow:
      #   1. On first use, call 'gitops clone <name>' at runtime to create the bare
      #      mirror at /config/gitops/<name>.git. Subsequent pod starts update the
      #      mirror automatically via 'gitops stage' or 'gitops deploy'.
      #   2. Call 'gitops stage <name> [--branch=X|--tag=X]' to fetch, create a
      #      candidate worktree, and validate it with 'hass --script check_config'.
      #      Result is written to staging state under /config/.gitops/state/.
      #   3. Call 'gitops deploy <name>' to promote the staged worktree to
      #      /config/packages/gitops/<name> and prune all previous worktrees.
      #      Requires a passing stage; use --force to override.
      #   4. Call 'gitops get <key>' (e.g. active.<repo>.ref, staging.<repo>.status)
      #      to read persisted state.
      gitops:
        enabled: false

        # Whitelisted repositories the gitops workflow can pull from.
        # Each repo is cloned as a bare mirror on every pod start. The gitops CLI
        # operates on repos by name at runtime.
        repos: []
        # - name: ha-config        # required: repo identifier (alphanumeric, hyphens, underscores)
        #   url: git@github.com:your-org/ha-config.git  # required: git remote URL
        #   allowedSigners: |      # optional: inline SSH public keys trusted to sign commits/tags
        #     user@example.com ssh-ed25519 AAAAC3...

        ssh:
          # SSH identity used for all repos. Required only when any repo URL uses
          # the git@ or ssh:// scheme. Not needed for https:// URLs.

          # Name of a Kubernetes Secret containing the SSH deploy key.
          # The chart mounts the key at /run/secrets/gitops/ssh_key (mode 0400).
          secretName: ""

          # Key within the Secret that holds the private key. Defaults to 'id_ed25519'.
          secretKey: "id_ed25519"

          # Raw known_hosts content for verifying the git host's identity.
          # Obtain with: ssh-keyscan <hostname>
          knownHosts: ""

  # Manages /config/configuration.yaml as a read-only ConfigMap mount. Requires persistence.enabled.
  # See: https://www.home-assistant.io/docs/configuration/
  #
  # content is a raw YAML string written verbatim to /config/configuration.yaml.
  # Use a literal block scalar (|) in your values file so that HA-specific tags such as
  # !include and !include_dir_named are preserved exactly as written:
  #
  #   homeAssistant:
  #     configuration:
  #       enabled: true
  #       content: |
  #         homeassistant:
  #           packages: !include_dir_named packages/
  #         http:
  #           use_x_forwarded_for: true
  #           trusted_proxies:
  #             - 10.0.0.0/8
  configuration:
    enabled: false
    # Raw string written verbatim as /config/configuration.yaml.
    # Override with a literal block scalar (|) to configure Home Assistant.
    # For gitops-managed installs, include the gitops/ directory so that deployed
    # repos are loaded as packages:
    #
    #   content: |
    #     homeassistant:
    #       packages: !include_dir_named gitops/
    content: ""
    checkConfig:
      enabled: false  # runs 'hass --script check_config' in an init container before startup. requires configuration.enabled and persistence.enabled
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
