initContainers:
  - name: wait-for-mqtt
    image: busybox:latest
    command: ["sh", "-c", "until nc -z mqtt 1883; do sleep 2; done"]

homeAssistant:
  initContainer:
    tasks:
      setupHACS:
        enabled: true
        version: "2.0.1"
      setupSecretsYaml:
        enabled: true
        secretName: ha-secrets
