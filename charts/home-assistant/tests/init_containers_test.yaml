suite: Init Containers
templates:
  - templates/statefulset.yaml
tests:
  - it: renders init containers in correct order with gitops, all tasks, and user containers enabled
    values:
      - fixtures/gitops-minimal.yaml
      - fixtures/init-containers.yaml
    set:
      homeAssistant.initContainer.tasks.setupHACS.enabled: true
      homeAssistant.initContainer.tasks.setupHACS.version: "2.0.1"
      homeAssistant.initContainer.tasks.setupSecretsYaml.enabled: true
      homeAssistant.initContainer.tasks.setupSecretsYaml.secretName: ha-secrets
      homeAssistant.configuration.enabled: true
      homeAssistant.configuration.checkConfig.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: gitops-init
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: bootstrap
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: docker.io/alpine:3.21
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: wait-for-mqtt
      - equal:
          path: spec.template.spec.initContainers[3].name
          value: check-config
      - equal:
          path: spec.template.spec.initContainers[3].image
          value: ghcr.io/home-assistant/home-assistant:2026.5
      - equal:
          path: spec.template.spec.initContainers[3].command[0]
          value: hass

  - it: gitops-init runs as root with DROP ALL, no CHOWN capability, and mounts SSH key when SSH is configured
    values:
      - fixtures/gitops-minimal.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: gitops-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: gitops-configmap
              mountPath: /run/gitops
              readOnly: true
            - name: gitops-ssh-key
              mountPath: /run/secrets/gitops/ssh_key
              subPath: id_ed25519
              readOnly: true

  - it: bootstrap has least-privilege security context with writable root for apk
    set:
      homeAssistant.initContainer.tasks.setupHACS.enabled: true
      homeAssistant.initContainer.tasks.setupHACS.version: "2.0.1"
      homeAssistant.initContainer.tasks.setupSecretsYaml.enabled: true
      homeAssistant.initContainer.tasks.setupSecretsYaml.secretName: ha-secrets
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: bootstrap
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: HACS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SECRETS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SECRETS_DIR
            value: "/run/secrets/ha-secrets"

  - it: gitops-init and bootstrap use homeAssistant.initContainer.resources when overridden
    values:
      - fixtures/gitops-minimal.yaml
    set:
      homeAssistant.initContainer.tasks.setupHACS.enabled: true
      homeAssistant.initContainer.tasks.setupHACS.version: "2.0.1"
      homeAssistant.initContainer.resources:
        requests:
          memory: 128Mi
          cpu: 100m
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.initContainers[1].resources.requests.memory
          value: 128Mi

  - it: check-config uses homeAssistant.configuration.checkConfig.resources when overridden
    set:
      homeAssistant.configuration.enabled: true
      homeAssistant.configuration.checkConfig.enabled: true
      homeAssistant.configuration.checkConfig.resources:
        requests:
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: check-config
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.memory
          value: 512Mi

  - it: bootstrap mounts config PVC and init-scripts ConfigMap; no secrets volume when setupSecretsYaml is disabled
    set:
      homeAssistant.initContainer.tasks.setupHACS.enabled: true
      homeAssistant.initContainer.tasks.setupHACS.version: "2.0.1"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: bootstrap
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: init-scripts
              mountPath: /run/init-scripts
              readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: init-scripts
            configMap:
              name: RELEASE-NAME-home-assistant-init-scripts
              defaultMode: 420

  - it: check-config mounts config PVC and configuration ConfigMap; gitops volumes are excluded
    values:
      - fixtures/gitops-minimal.yaml
    set:
      homeAssistant.configuration.enabled: true
      homeAssistant.configuration.checkConfig.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: gitops-init
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: check-config
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: ha-configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
