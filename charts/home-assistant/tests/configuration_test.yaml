suite: Configuration
templates:
  - templates/statefulset.yaml
  - templates/configmap-configuration.yaml
tests:
  - it: renders configuration ConfigMap with configuration.yaml key
    template: templates/configmap-configuration.yaml
    set:
      homeAssistant.configuration.enabled: true
      homeAssistant.configuration.config:
        homeassistant:
          name: Home
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: -configuration$
      - equal:
          path: data["configuration.yaml"]
          value: |
            homeassistant:
              name: Home

  - it: does not render configuration ConfigMap when disabled
    template: templates/configmap-configuration.yaml
    set:
      homeAssistant.configuration.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: configuration ConfigMap is mounted at /config/configuration.yaml in main container and check-config via subPath
    template: templates/statefulset.yaml
    set:
      homeAssistant.configuration.enabled: true
      homeAssistant.configuration.config:
        homeassistant:
          name: Home
      homeAssistant.configuration.checkConfig.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: check-config
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: ha-configuration
            mountPath: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ha-configuration
            mountPath: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true

