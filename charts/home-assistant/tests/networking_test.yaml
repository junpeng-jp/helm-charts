suite: Networking
templates:
  - templates/service.yaml
  - templates/service-headless.yaml
  - templates/service-gitops.yaml
tests:
  # ClusterIP Service
  - it: renders a ClusterIP Service with port 8123 and correct selector labels
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-home-assistant
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 8123
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: home-assistant

  # The "app" service key gets the chart fullname; any other key gets fullname-suffix.
  - it: names the app service with fullname and additional services with fullname-suffix
    template: templates/service.yaml
    set:
      networking.service.metrics.enabled: true
      networking.service.metrics.type: ClusterIP
      networking.service.metrics.ports.metrics.enabled: true
      networking.service.metrics.ports.metrics.port: 9090
      networking.service.metrics.ports.metrics.protocol: TCP
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-home-assistant-metrics
        documentIndex: 1

  - it: does not render a Service document when the service entry is disabled
    template: templates/service.yaml
    set:
      networking.service.app.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Headless Service
  - it: renders a headless Service with correct name, clusterIP, port, and publishNotReadyAddresses
    template: templates/service-headless.yaml
    asserts:
      - isKind:
          of: Service
      - matchRegex:
          path: metadata.name
          pattern: -headless$
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: headless Service omits ports when networking.service.app is disabled
    template: templates/service-headless.yaml
    set:
      networking.service.app.enabled: false
    asserts:
      - isKind:
          of: Service
      - notExists:
          path: spec.ports

  - it: headless Service publishNotReadyAddresses can be set to false
    template: templates/service-headless.yaml
    set:
      networking.headlessService.publishNotReadyAddresses: false
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
