suite: Standard
templates:
  - templates/statefulset.yaml
  - templates/service.yaml
  - templates/service-gitops.yaml
  - templates/tests/test-connection.yaml
tests:
  - it: renders a StatefulSet with minimal config
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-assistant/home-assistant:2026.5
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: config
      - equal:
          path: spec.template.spec.hostNetwork
          value: false
      - notExists:
          path: spec.template.spec.dnsPolicy
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: renders a fully-configured StatefulSet with all features enabled
    template: templates/statefulset.yaml
    values:
      - fixtures/full-values.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: local-path
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
      - equal:
          path: spec.template.spec.containers[1].name
          value: gitops
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-home-assistant

  - it: uses digest over tag for the main image when both are set
    template: templates/statefulset.yaml
    set:
      global.image.tag: "2026.5"
      global.image.digest: "sha256:abc123"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-assistant/home-assistant@sha256:abc123

  - it: StatefulSet references the headless service as serviceName
    template: templates/statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.serviceName
          pattern: -headless$

  - it: sets dnsPolicy to ClusterFirstWithHostNet when hostNetwork is enabled
    template: templates/statefulset.yaml
    set:
      pod.hostNetwork: true
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet

  - it: test-connection pod uses testImage tag by default
    template: templates/tests/test-connection.yaml
    asserts:
      - equal:
          path: spec.containers[0].image
          value: docker.io/busybox:1.37

  - it: test-connection pod uses digest when testImage.digest is set
    template: templates/tests/test-connection.yaml
    set:
      global.testImage.digest: "sha256:abc123"
    asserts:
      - equal:
          path: spec.containers[0].image
          value: docker.io/busybox@sha256:abc123

  - it: gitops Service is not created with default values
    template: templates/service-gitops.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: StatefulSet defaults to OrderedReady podManagementPolicy and RollingUpdate strategy
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
      - equal:
          path: spec.updateStrategy.rollingUpdate.partition
          value: 0

