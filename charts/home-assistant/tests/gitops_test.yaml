suite: GitOps
templates:
  - templates/statefulset.yaml
  - templates/configmap-gitops.yaml
  - templates/service-gitops.yaml
tests:
  # Sidecar placement and configuration
  - it: gitops sidecar is in containers[1] not in initContainers
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: gitops
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: gitops

  - it: sidecar has GITOPS_PORT and GITOPS_CONFIG_FILE env vars
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GITOPS_PORT
            value: "9001"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GITOPS_CONFIG_FILE
            value: /run/gitops-runtime/config.json

  - it: sidecar has least-privilege security context without readOnlyRootFilesystem
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          content: ALL
      - notExists:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem

  - it: sidecar exposes container port named gitops on the configured port
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            name: gitops
            containerPort: 9001
            protocol: TCP

  - it: no gitops sidecar or init container rendered when gitops is disabled
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.containers[0].name
          value: home-assistant
      - notExists:
          path: spec.template.spec.containers[1]

  - it: gitops sidecar uses gitops.resources when overridden
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    set:
      homeAssistant.gitops.resources:
        requests:
          memory: 128Mi
          cpu: 100m
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: gitops
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 128Mi

  # Volumes — SSH
  - it: SSH fixture has correct sidecar mounts, main-container mounts, and volume declarations
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-runtime
            mountPath: /run/gitops-runtime
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-workspace
            mountPath: /gitops/repos
      - notContains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: config
            mountPath: /config
      - notContains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-signers
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-ssh-key
            mountPath: /run/secrets/gitops-ssh-key
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-workspace
            mountPath: /gitops/repos
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-runtime
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-ssh-key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-workspace
            emptyDir: {}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gitops-runtime
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-ssh-key
            secret:
              secretName: ha-ssh-key
              defaultMode: 288
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-runtime
            configMap:
              name: RELEASE-NAME-home-assistant-gitops
              items:
                - key: config.json
                  path: config.json
                  mode: 420
                - key: gitconfig
                  path: gitconfig
                  mode: 420
                - key: ssh_config
                  path: ssh_config
                  mode: 420
                - key: known_hosts
                  path: known_hosts
                  mode: 420
                - key: ha-config.gitconfig
                  path: ha-config/gitconfig
                  mode: 420
                - key: ha-config.allowed-signers
                  path: ha-config/allowed-signers
                  mode: 420
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gitops-signers

  # Volumes — HTTPS
  - it: HTTPS fixture has correct sidecar mounts, credential script mode 0755, and no SSH/signers entries
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-https.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-https-github-com
            mountPath: /run/secrets/gitops-https/github.com/token
            subPath: token
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-https-github-com
            secret:
              secretName: ha-github-token
              defaultMode: 288
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-runtime
            configMap:
              name: RELEASE-NAME-home-assistant-gitops
              items:
                - key: config.json
                  path: config.json
                  mode: 420
                - key: gitconfig
                  path: gitconfig
                  mode: 420
                - key: ha-config.gitconfig
                  path: ha-config/gitconfig
                  mode: 420
                - key: ha-config.credential
                  path: ha-config/credential
                  mode: 493
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gitops-signers

  # Volumes — Mixed
  - it: mixed fixture has both SSH and HTTPS volumes mounted in sidecar
    template: templates/statefulset.yaml
    values:
      - fixtures/gitops-mixed.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-ssh-key
            mountPath: /run/secrets/gitops-ssh-key
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: gitops-https-gitea-example-com
            mountPath: /run/secrets/gitops-https/gitea.example.com/token
            subPath: token
            readOnly: true

  # ConfigMap — SSH
  - it: SSH ConfigMap has all expected keys, config.json structure, gitconfig dispatch, and webhook notification
    template: templates/configmap-gitops.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - isNotNullOrEmpty:
          path: data["config.json"]
      - isNotNullOrEmpty:
          path: data["gitconfig"]
      - isNotNullOrEmpty:
          path: data["ssh_config"]
      - isNotNullOrEmpty:
          path: data["known_hosts"]
      - matchRegex:
          path: data["config.json"]
          pattern: '"workspaceDir":"/gitops/repos"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"name":"ha-config"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"url":"http://localhost:8123/api/webhook/my-webhook-id"'
      - notMatchRegex:
          path: data["gitconfig"]
          pattern: '\[gpg\]'
      - matchRegex:
          path: data["gitconfig"]
          pattern: 'includeIf "hasconfig:remote\.\*\.url:git@github\.com:org/ha-config\.git"'
      - matchRegex:
          path: data["gitconfig"]
          pattern: 'path = /run/gitops-runtime/ha-config/gitconfig'
      - isNotNullOrEmpty:
          path: data["ha-config.gitconfig"]
      - matchRegex:
          path: data["ha-config.gitconfig"]
          pattern: '\[gpg\]'
      - matchRegex:
          path: data["ha-config.gitconfig"]
          pattern: 'allowedSignersFile = /run/gitops-runtime/ha-config/allowed-signers'
      - isNotNullOrEmpty:
          path: data["ha-config.allowed-signers"]
      - matchRegex:
          path: data["ha-config.allowed-signers"]
          pattern: 'admin@example.com'

  # ConfigMap — HTTPS
  - it: HTTPS ConfigMap has per-repo credential helper, no SSH keys, and no webhook notification
    template: templates/configmap-gitops.yaml
    values:
      - fixtures/gitops-https.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - notExists:
          path: data["ssh_config"]
      - notExists:
          path: data["known_hosts"]
      - notExists:
          path: data["credential-github-com"]
      - notMatchRegex:
          path: data["config.json"]
          pattern: '"notification"'
      - notMatchRegex:
          path: data["gitconfig"]
          pattern: 'credential "https://github.com"'
      - matchRegex:
          path: data["gitconfig"]
          pattern: 'includeIf.*ha-config'
      - isNotNullOrEmpty:
          path: data["ha-config.gitconfig"]
      - matchRegex:
          path: data["ha-config.gitconfig"]
          pattern: 'credential "https://github.com"'
      - matchRegex:
          path: data["ha-config.gitconfig"]
          pattern: 'helper = /run/gitops-runtime/ha-config/credential'
      - isNotNullOrEmpty:
          path: data["ha-config.credential"]
      - matchRegex:
          path: data["ha-config.credential"]
          pattern: '/run/secrets/gitops-https/github.com/token'
      - matchRegex:
          path: data["ha-config.credential"]
          pattern: "'x-access-token'"

  # ConfigMap — Mixed
  - it: mixed ConfigMap has SSH config and per-repo HTTPS credential helper
    template: templates/configmap-gitops.yaml
    values:
      - fixtures/gitops-mixed.yaml
    asserts:
      - isNotNullOrEmpty:
          path: data["ssh_config"]
      - isNotNullOrEmpty:
          path: data["known_hosts"]
      - notExists:
          path: data["credential-gitea-example-com"]
      - isNotNullOrEmpty:
          path: data["custom-components.gitconfig"]
      - matchRegex:
          path: data["custom-components.gitconfig"]
          pattern: 'credential "https://gitea.example.com"'
      - isNotNullOrEmpty:
          path: data["custom-components.credential"]
      - matchRegex:
          path: data["custom-components.credential"]
          pattern: '/run/secrets/gitops-https/gitea.example.com/token'

  # Service
  - it: gitops Service is ClusterIP with correct name, port, and selector labels
    template: templates/service-gitops.yaml
    values:
      - fixtures/gitops-ssh.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-home-assistant-gitops
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: gitops
            port: 9001
            targetPort: gitops
            protocol: TCP
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: home-assistant
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
