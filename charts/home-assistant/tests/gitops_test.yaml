suite: GitOps
templates:
  - templates/statefulset.yaml
  - templates/configmap-gitops-sync-script.yaml
tests:
  - it: gitops-setup init container writes repo remote URLs via printf in command
    template: templates/statefulset.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: gitops-known-hosts
      homeAssistant.gitops.ssh.keySecret: ha-gitops-ssh
      homeAssistant.gitops.repos:
        - name: ha-config
          url: "git@github.com:example/ha-config.git"
        - name: ha-blueprints
          url: "git@github.com:example/ha-blueprints.git"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: gitops-setup
      - notExists:
          path: spec.template.spec.initContainers[0].env
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "git@github.com:example/ha-config.git"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "git@github.com:example/ha-blueprints.git"

  - it: renders sync-script ConfigMap with sync.sh content when gitops is enabled
    template: templates/configmap-gitops-sync-script.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: gitops-known-hosts
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: -gitops-sync-script$
      - isNotEmpty:
          path: data["sync.sh"]
      - matchRegex:
          path: data["sync.sh"]
          pattern: "GIT_SSH_COMMAND"

  - it: gitops volumes, mounts, and ssh key are configured correctly when gitops is enabled
    template: templates/statefulset.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: gitops-known-hosts
      homeAssistant.gitops.ssh.keySecret: ha-gitops-ssh
      homeAssistant.gitops.repos:
        - name: ha-config
          url: "git@github.com:example/ha-config.git"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-sync-script
            configMap:
              name: RELEASE-NAME-home-assistant-gitops-sync-script
              defaultMode: 493
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-sync-script
            mountPath: /config/gitops/scripts/sync.sh
            subPath: sync.sh
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-known-hosts
            mountPath: /run/secrets/gitops/known_hosts
            subPath: known_hosts
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-ha-check
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-ha-check
            mountPath: /run/ha-check
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-ssh-key
            secret:
              secretName: ha-gitops-ssh
              defaultMode: 256
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-ssh-key
            mountPath: /run/secrets/gitops/ssh_key
            subPath: id_ed25519
            readOnly: true

  - it: gitops-known-hosts volume references the user-supplied ConfigMap name
    template: templates/statefulset.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: my-custom-known-hosts
      homeAssistant.gitops.ssh.keySecret: ha-gitops-ssh
      homeAssistant.gitops.repos:
        - name: ha-config
          url: "git@github.com:example/ha-config.git"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-known-hosts
            configMap:
              name: my-custom-known-hosts

  - it: renders allowed-signers volume referencing user-supplied ConfigMap name and mounts it when allowedSignersConfigMap is set
    template: templates/statefulset.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: gitops-known-hosts
      homeAssistant.gitops.ssh.keySecret: ha-gitops-ssh
      homeAssistant.gitops.ssh.allowedSignersConfigMap: gitops-allowed-signers
      homeAssistant.gitops.repos:
        - name: ha-config
          url: "git@github.com:example/ha-config.git"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-allowed-signers
            configMap:
              name: gitops-allowed-signers
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-allowed-signers
            mountPath: /run/secrets/gitops/allowed_signers
            subPath: allowed_signers
            readOnly: true

  - it: does not render sync-script ConfigMap when gitops is disabled
    template: templates/configmap-gitops-sync-script.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: gitops volumes and mounts are absent when gitops is disabled
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.volumes[0]

  - it: does not render allowed-signers volume when allowedSignersConfigMap is empty
    template: templates/statefulset.yaml
    set:
      homeAssistant.gitops.enabled: true
      homeAssistant.gitops.ssh.knownHostsConfigMap: gitops-known-hosts
      homeAssistant.gitops.ssh.keySecret: ha-gitops-ssh
      homeAssistant.gitops.ssh.allowedSignersConfigMap: ""
      homeAssistant.gitops.repos:
        - name: ha-config
          url: "git@github.com:example/ha-config.git"
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gitops-allowed-signers
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-allowed-signers
