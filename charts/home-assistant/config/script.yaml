script:
  gitops_sync:
    alias: "GitOps Sync"
    fields:
      branch:
        name: Branch
        description: "Branch to sync (mutually exclusive with tag)"
        selector:
          text:
      tag:
        name: Tag
        description: "Tag to sync (mutually exclusive with branch)"
        selector:
          text:
    sequence:
      - variables:
          repo: "{{ states('sensor.gitops_repo_name') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ branch | default('') != '' }}"
            sequence:
              - action: shell_command.git_sync_branch
                data:
                  repo: "{{ repo }}"
                  branch: "{{ branch }}"
                response_variable: sync_result
          - conditions:
              - condition: template
                value_template: "{{ tag | default('') != '' }}"
            sequence:
              - action: shell_command.git_sync_tag
                data:
                  repo: "{{ repo }}"
                  tag: "{{ tag }}"
                response_variable: sync_result
        default:
          - stop: "Either branch or tag must be provided"
            error: true
      - condition: template
        value_template: "{{ sync_result.returncode == 0 }}"
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.gitops_sync_ref
            - sensor.gitops_last_sync
      - action: homeassistant.reload_core_config

automation:
  - alias: "GitOps Webhook Sync"
    id: gitops_webhook_sync
    trigger:
      - platform: webhook
        webhook_id: gitops-sync
        allowed_methods:
          - POST
    action:
      - action: script.gitops_sync
        data:
          branch: "{{ trigger.json.branch | default('') }}"
          tag: "{{ trigger.json.tag | default('') }}"
