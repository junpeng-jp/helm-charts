# networking: each enabled service must have at least one enabled port
{{- range $svcName := keys .Values.networking.service | sortAlpha }}
{{- $svc := index $.Values.networking.service $svcName }}
{{- if $svc.enabled }}
{{- $check := dict "hasPorts" false }}
{{- range $portName := keys $svc.ports | sortAlpha }}
{{- $port := index $svc.ports $portName }}
{{- if ne $port.enabled false }}
{{- $_ := set $check "hasPorts" true }}
{{- end }}
{{- end }}
{{- if not (get $check "hasPorts") }}
{{- fail (printf "networking.service.%s is enabled but has no enabled ports; enable at least one port or disable the service" $svcName) }}
{{- end }}
{{- end }}
{{- end }}

# ingress: at most one ingress method may be active, and the enabled method requires networking.service.app with an http port
{{- if and .Values.ingress.gateway.enabled .Values.ingress.traefik.enabled }}
{{- fail "Only one ingress mechanism may be enabled at a time (ingress.gateway or ingress.traefik)" }}
{{- end }}
{{- if and (or .Values.ingress.gateway.enabled .Values.ingress.traefik.enabled) (not .Values.networking.service.app.enabled) }}
{{- fail (printf "%s requires networking.service.app to be enabled" (ternary "ingress.gateway" "ingress.traefik" .Values.ingress.gateway.enabled)) }}
{{- end }}
{{- $httpPort := index .Values.networking.service.app.ports "http" }}
{{- if and (or .Values.ingress.gateway.enabled .Values.ingress.traefik.enabled) (or (not $httpPort) (eq (get $httpPort "enabled") false)) }}
{{- fail (printf "%s requires networking.service.app.ports.http to be defined and enabled" (ternary "ingress.gateway" "ingress.traefik" .Values.ingress.gateway.enabled)) }}
{{- end }}

# persistence: existingClaim and existingVolume have no effect unless persistence.enabled, and ReadWriteOnce is incompatible with replicaCount > 1
{{- if and .Values.persistence.existingClaim (not .Values.persistence.enabled) }}
{{- fail "persistence.existingClaim has no effect when persistence.enabled is false; set persistence.enabled: true" }}
{{- end }}
{{- if and .Values.persistence.existingVolume (not .Values.persistence.enabled) }}
{{- fail "persistence.existingVolume has no effect when persistence.enabled is false; set persistence.enabled: true" }}
{{- end }}
{{- if and .Values.persistence.enabled (gt (int .Values.replicaCount) 1) (has "ReadWriteOnce" .Values.persistence.accessModes) }}
{{- fail "replicaCount > 1 is incompatible with ReadWriteOnce storage; use ReadWriteMany or set replicaCount: 1" }}
{{- end }}

# features that require persistence
{{- $needsPersistence := list
    (dict "enabled" .Values.homeAssistant.initContainer.tasks.setupHACS.enabled        "msg" "homeAssistant.initContainer.tasks.setupHACS requires persistence.enabled to be true")
    (dict "enabled" .Values.homeAssistant.initContainer.tasks.setupSecretsYaml.enabled "msg" "homeAssistant.initContainer.tasks.setupSecretsYaml requires persistence.enabled to be true")
    (dict "enabled" .Values.homeAssistant.configuration.enabled "msg" "homeAssistant.configuration.enabled requires persistence.enabled to be true")
    (dict "enabled" .Values.homeAssistant.initContainer.tasks.gitops.enabled "msg" "homeAssistant.initContainer.tasks.gitops.enabled requires persistence.enabled to be true")
}}
{{- range $needsPersistence }}
{{- if and .enabled (not $.Values.persistence.enabled) }}
{{- fail .msg }}
{{- end }}
{{- end }}

# configuration: checkConfig requires homeAssistant.configuration.enabled
{{- if and .Values.homeAssistant.configuration.checkConfig.enabled (not .Values.homeAssistant.configuration.enabled) }}
{{- fail "homeAssistant.configuration.checkConfig.enabled requires homeAssistant.configuration.enabled to be true" }}
{{- end }}

# secretVolumeMounts: each volume name (secretName, or .name if set) must be unique across all entries
{{- $seen := dict }}
{{- range .Values.secretVolumeMounts }}
{{- $volName := .name | default .secretName }}
{{- if index $seen $volName }}
{{- fail (printf "secretVolumeMounts: duplicate volume name %q; set a unique .name on one of the entries to disambiguate" $volName) }}
{{- end }}
{{- $_ := set $seen $volName true }}
{{- end }}

# setupSecretsYaml / secretVolumeMounts cross-check
{{- if .Values.homeAssistant.initContainer.tasks.setupSecretsYaml.enabled }}
{{- range .Values.secretVolumeMounts }}
{{- if eq .secretName $.Values.homeAssistant.initContainer.tasks.setupSecretsYaml.secretName }}
{{- fail (printf "secretVolumeMounts: secret %q is already used by homeAssistant.initContainer.tasks.setupSecretsYaml to generate /config/secrets.yaml; remove it from secretVolumeMounts" $.Values.homeAssistant.initContainer.tasks.setupSecretsYaml.secretName) }}
{{- end }}
{{- end }}
{{- end }}

# monitor: monitor.metric.port must reference an enabled port in at least one enabled service
{{- if .Values.monitor.metric.enabled }}
{{- $metricPort := .Values.monitor.metric.port }}
{{- $allPorts := list }}
{{- range $svcName := keys .Values.networking.service | sortAlpha }}
{{- $svc := index $.Values.networking.service $svcName }}
{{- if $svc.enabled }}
{{- range $portName := keys $svc.ports | sortAlpha }}
{{- $port := index $svc.ports $portName }}
{{- if not (eq $port.enabled false) }}
{{- $allPorts = append $allPorts $portName }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (has $metricPort $allPorts) }}
{{- fail (printf "monitor.metric.port %q is not defined in any enabled service in networking.service" $metricPort) }}
{{- end }}
{{- end }}

# user initContainers reserved name check
{{- $reservedInitNames := list "gitops-setup" "bootstrap" "check-config" }}
{{- range .Values.initContainers }}
{{- if has .name $reservedInitNames }}
{{- fail (printf "initContainers: name %q is reserved by the chart; rename your init container" .name) }}
{{- end }}
{{- end }}
